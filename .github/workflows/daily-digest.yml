name: Digest quotidiano

# Ogni account sceglie dall'app a che ora vuole il digest, una o due volte al
# giorno, quindi il workflow si sveglia ogni mezzora e lo script costruisce solo
# per chi ha appuntamento in quel momento. La mezzora, invece dell'ora, serve
# soprattutto al pulsante "Aggiorna adesso" dentro l'app: dimezza l'attesa fra
# la richiesta e il digest.
#
# Le ore sono UTC. L'Italia e' UTC+1 d'inverno e UTC+2 d'estate, quindi
# 04:00-21:00 UTC copre le 05:00-23:00 italiane: abbastanza da servire qualunque
# ora fra le 6 e le 22, che sono quelle che l'app offre, in tutte e due le
# stagioni. Di notte non si sveglia: sarebbero minuti spesi per niente.
#
# Costo: un'esecuzione a vuoto dura una manciata di secondi ma viene conteggiata
# come un minuto, quindi 36 al giorno fanno circa 1080 minuti al mese sui 2000
# inclusi nel piano gratuito per i repository privati.
on:
  schedule:
    - cron: '0,30 4-21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Lancia subito, ignorando l'ora scelta"
        type: boolean
        default: false

# Un digest per volta: due esecuzioni in parallelo scriverebbero lo stesso
# documento, e la seconda non porterebbe niente di nuovo.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Con dieci topic servono pochi minuti; oltre, qualcosa si e' bloccato e
    # tenere occupato un runner non aiuta nessuno.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # La pipeline esegue TypeScript direttamente, senza compilazione:
          # serve un Node abbastanza recente da togliere i tipi da solo.
          node-version: '24'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Installa le dipendenze
        working-directory: pipeline
        run: npm ci

      - name: Costruisci il digest
        working-directory: pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run digest -- ${{ inputs.force && '--force' || '' }}
