name: Digest quotidiano

# Ogni account sceglie dall'app a che ora vuole il digest, una o due volte al
# giorno, e lo sceglie nel fuso in cui si trova. Il workflow si sveglia ogni
# mezzora e lo script costruisce solo per chi ha appuntamento in quel momento.
#
# Sveglio 24 ore su 24, e non piu' solo di giorno: le 10:00 di chi sta a Tokyo
# sono l'01:00 UTC, quindi una finestra tarata sull'Italia lascerebbe scoperto
# chiunque viaggi. Non essendoci un fuso privilegiato, non c'e' una notte in
# cui dormire.
#
# Costo: un'esecuzione a vuoto dura una manciata di secondi ma viene conteggiata
# come un minuto, quindi 48 al giorno fanno circa 1440 minuti al mese, piu' un
# paio di centinaia per le costruzioni vere: circa 1700 sui 2000 inclusi nel
# piano gratuito per i repository privati. Se un giorno diventasse stretto,
# passare a ogni ora dimezza il conto e costa solo mezz'ora di attesa in piu'
# sul pulsante "Aggiorna adesso".
on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Lancia subito, ignorando l'ora scelta"
        type: boolean
        default: false

# Un digest per volta: due esecuzioni in parallelo scriverebbero lo stesso
# documento, e la seconda non porterebbe niente di nuovo.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Con dieci topic servono pochi minuti; oltre, qualcosa si e' bloccato e
    # tenere occupato un runner non aiuta nessuno.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # La pipeline esegue TypeScript direttamente, senza compilazione:
          # serve un Node abbastanza recente da togliere i tipi da solo.
          node-version: '24'
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Installa le dipendenze
        working-directory: pipeline
        run: npm ci

      - name: Costruisci il digest
        working-directory: pipeline
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: npm run digest -- ${{ inputs.force && '--force' || '' }}
